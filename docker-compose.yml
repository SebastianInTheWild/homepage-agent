services:
  homepage-agent:
    build: .
    image: homepage-agent:latest
    container_name: homepage-agent
    restart: unless-stopped
    environment:
      NPM_URL: ${NPM_URL}
      NPM_USER: ${NPM_USER}
      NPM_PASSWORD: ${NPM_PASSWORD}
      TECHNITIUM_URL: ${TECHNITIUM_URL}
      TECHNITIUM_TOKEN: ${TECHNITIUM_TOKEN}
      TECHNITIUM_ZONES: ${TECHNITIUM_ZONES:-}
      PROXMOX_URL: ${PROXMOX_URL:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      CHECK_SCHEDULE: ${CHECK_SCHEDULE:-0 8 * * *}
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:-}
      IGNORE: ${IGNORE:-}
      DEFAULT_GROUP: ${DEFAULT_GROUP:-}
      RUN_ON_START: ${RUN_ON_START:-false}
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-3}
      TZ: Europe/Berlin
      HOMEPAGE_CONFIG_DIR: /config
      DATA_DIR: /data
      WORK_SLACK_CHANNEL_ID: ${WORK_SLACK_CHANNEL_ID:-}
    volumes:
      - ${HOMEPAGE_CONFIG:?HOMEPAGE_CONFIG fehlt}:/config
      - ${DATA_PATH:?DATA_PATH fehlt}:/data
      # zweite Homepage-Instanz für Links aus WORK_SLACK_CHANNEL_ID (optional)
      - ${WORK_HOMEPAGE_CONFIG:-./work-config}:/work-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
