display_information:
  name: Homepage-Agent
  description: Prüft, ob alle Homelab-Dienste im Homepage-Dashboard stehen
features:
  bot_user:
    display_name: homepage-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history  # für „reset“: eigene Nachrichten im Channel finden und löschen
      - groups:history    # dasselbe für private Channels
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
